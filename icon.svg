<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c27f"/>
      <stop offset="100%" style="stop-color:#fc5c7d"/>
    </linearGradient>
    <linearGradient id="scythe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c0c0c0"/>
      <stop offset="50%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#a0a0a0"/>
    </linearGradient>
    <linearGradient id="hourglass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c27f"/>
      <stop offset="100%" style="stop-color:#e6a23c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <g transform="translate(18, 12)">
      <path d="M56 8 C56 8 68 12 72 20 C76 28 74 40 66 44 C58 48 46 44 42 36 C38 28 40 16 48 10 Z" 
            fill="url(#scythe)" stroke="#888" stroke-width="1" opacity="0.95"/>
      <line x1="56" y1="20" x2="30" y2="96" stroke="#8B7355" stroke-width="5" stroke-linecap="round"/>
      <line x1="30" y1="96" x2="28" y2="100" stroke="#6B5335" stroke-width="6" stroke-linecap="round"/>
      <path d="M56 8 C56 8 68 12 72 20 C76 28 74 40 66 44" 
            fill="none" stroke="#ddd" stroke-width="2" opacity="0.5"/>
    </g>
  </g>
  <g transform="translate(58, 42)" filter="url(#glow)">
    <polygon points="24,0 44,16 24,32 4,16" fill="url(#hourglass)" opacity="0.9"/>
    <polygon points="24,32 44,48 24,64 4,48" fill="url(#hourglass)" opacity="0.7"/>
    <line x1="4" y1="16" x2="44" y2="16" stroke="#e6a23c" stroke-width="2" opacity="0.6"/>
    <line x1="4" y1="48" x2="44" y2="48" stroke="#e6a23c" stroke-width="2" opacity="0.6"/>
    <ellipse cx="24" cy="40" rx="10" ry="6" fill="#f0c27f" opacity="0.5"/>
  </g>
  <g transform="translate(22, 88)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="url(#gold)" letter-spacing="2">K</text>
  </g>
  <g opacity="0.15">
    <circle cx="100" cy="24" r="1.5" fill="#f0c27f"/>
    <circle cx="108" cy="32" r="1" fill="#f0c27f"/>
    <circle cx="96" cy="18" r="1" fill="#f0c27f"/>
    <circle cx="20" cy="30" r="1.5" fill="#f0c27f"/>
    <circle cx="14" cy="22" r="1" fill="#f0c27f"/>
    <circle cx="26" cy="38" r="1" fill="#f0c27f"/>
    <circle cx="110" cy="90" r="1.5" fill="#f0c27f"/>
    <circle cx="104" cy="98" r="1" fill="#f0c27f"/>
  </g>
</svg>
